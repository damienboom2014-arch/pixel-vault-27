
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework Arcade</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    h1 { color: #65e6ff; }
    .card {
      background: #202e45;
      padding: 18px;
      margin: 12px auto;
      border-radius: 14px;
      max-width: 350px;
    }
    a { color: #65e6ff; }
  </style>
</head>
<body>
  <h1>🎮 Homework Arcade</h1>
  <p>Your school portal for fun and learning!</p>

  <div class="card">
    <h2>🎯 Games</h2>
    <a href="https://www.coolmathgames.com/">Play Coolmath Games</a>
  </div>

  <div class="card">
    <h2>📺 YouTube</h2>
    <a href="https://www.youtube.com/">Open YouTube</a>
  </div>

  <div class="card">
    <h2>🔎 Search</h2>
    <a href="https://www.google.com/">Search the web</a>
  </div>

  <div class="card">
    <h2>🎬 Movies</h2>
    <a href="https://www.justwatch.com/">Find movies</a>
  </div>
</body>
</html>
